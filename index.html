<title>Mi-Chemin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout concept: a French road-sign prompt panel sits beside a to-scale map of France.
   Color: ground, land, border ink, autoroute blue, guess red, midpoint gold.
   Type: Barlow Condensed (signage display), Barlow (text and data). */
:root {
  --bg: #e9eef3;
  --panel: #ffffff;
  --line: #cdd7e1;
  --fg: #12202f;
  --muted: #566679;
  --ground: #d7e5f1;
  --land: #f7f8f5;
  --land2: #e4e9e5;
  --border: #2d4a68;
  --grid: rgba(45, 74, 104, 0.13);
  --sign: #0a4aa6;
  --blue: #0a4aa6;
  --btn: #0a4aa6;
  --btnfg: #ffffff;
  --red: #d5352d;
  --gold: #f7c600;
  --ink: #12202f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b121a;
    --panel: #121c27;
    --line: #243445;
    --fg: #e6edf4;
    --muted: #92a4b7;
    --ground: #0d1d2c;
    --land: #18293b;
    --land2: #122131;
    --border: #5d86b0;
    --grid: rgba(143, 175, 206, 0.11);
    --sign: #0f4fb4;
    --blue: #5aa0ff;
    --btn: #5aa0ff;
    --btnfg: #071220;
    --red: #ff6a5c;
    --gold: #ffd23f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b121a;
  --panel: #121c27;
  --line: #243445;
  --fg: #e6edf4;
  --muted: #92a4b7;
  --ground: #0d1d2c;
  --land: #18293b;
  --land2: #122131;
  --border: #5d86b0;
  --grid: rgba(143, 175, 206, 0.11);
  --sign: #0f4fb4;
  --blue: #5aa0ff;
  --btn: #5aa0ff;
  --btnfg: #071220;
  --red: #ff6a5c;
  --gold: #ffd23f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.45 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 {
  margin: 0;
  font: 700 42px/1 'Barlow Condensed', 'Arial Narrow', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.tag { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.stats { display: flex; gap: 8px; }
.hdr-r { display: grid; gap: 10px; justify-items: end; }
.langs { display: flex; gap: 4px; }
.langs button { min-width: 42px; padding: 6px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; font: 600 13px/1 'Barlow', sans-serif; letter-spacing: 0.06em; cursor: pointer; }
.langs button:hover { border-color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--btn); color: var(--btnfg); border-color: var(--btn); }
.langs button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mid { text-align: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 10px 18px 9px; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font: 700 20px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); }
.tabs button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
.stat { padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; min-width: 84px; }
.stat small { display: block; font: 600 11px/1.3 'Barlow', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 700 24px/1.1 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }

.layout {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-areas: "map sign" "map panel";
  grid-template-rows: auto 1fr;
  align-items: start;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sign" "map" "panel"; grid-template-rows: none; }
}

/* Road-sign prompt */
.sign { grid-area: sign; background: var(--sign); border-radius: 14px; padding: 5px; min-width: 0; }
.sign-in { border: 2.5px solid #fff; border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; color: #fff; }
.city { display: flex; align-items: center; gap: 12px; min-width: 0; font: 700 32px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; overflow-wrap: anywhere; }
.pin { flex: none; width: 30px; height: 30px; border-radius: 6px; background: #fff; color: var(--sign); display: grid; place-items: center; font: 700 20px/1 'Barlow Condensed', sans-serif; letter-spacing: 0; }
.mid { display: flex; align-items: center; gap: 10px; font: 600 12px/1.2 'Barlow', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
.mid::before, .mid::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.55); }

/* Map */
.mapwrap { grid-area: map; position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--ground); min-width: 0; }
#map { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.ctl { position: absolute; top: 10px; right: 10px; display: grid; gap: 6px; }
.ctl button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 20px/1 'Barlow', sans-serif; cursor: pointer; }
.ctl button:hover { border-color: var(--muted); }
.ctl button:focus-visible, .btn:focus-visible, .tog input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.scale { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px 3px; font: 600 11px/1.2 'Barlow', sans-serif; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.scale i { display: block; height: 5px; border: 1.5px solid var(--fg); border-top: none; margin-bottom: 2px; }

/* SVG map styling */
.ground { fill: var(--ground); }
#around { fill: var(--land2); stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#water { fill: var(--ground); stroke: var(--border); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#grat line { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
#land { fill: var(--land); stroke: var(--border); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.mk text { font: 600 12.5px 'Barlow', sans-serif; fill: var(--fg); paint-order: stroke; stroke: var(--land); stroke-width: 3.5px; stroke-linejoin: round; }
.geo text { fill: var(--muted); stroke: none; font: 600 10.5px 'Barlow', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; text-anchor: middle; opacity: 0.85; }
.geo.sea text { font-style: italic; text-transform: none; letter-spacing: 0.06em; font-size: 12px; font-weight: 500; }
.ref circle { fill: var(--muted); stroke: var(--land); stroke-width: 1; }
.ref text { display: none; font-weight: 500; font-size: 11px; fill: var(--muted); }
.ref.major text, .zoomed .ref text { display: block; }
.ref.off { display: none; }
.norefs #refs { display: none; }
.city-mk circle { fill: var(--blue); stroke: var(--land); stroke-width: 2.5; }
.city-mk text.name { font: 700 16px 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
.let { fill: #fff !important; stroke: none !important; font: 700 12px 'Barlow Condensed', sans-serif !important; text-anchor: middle; }
.city-mk .let { fill: var(--btnfg) !important; }
.guess-mk circle.o { fill: var(--red); stroke: #fff; stroke-width: 2.5; }
.guess-mk circle.c { fill: #fff; }
.mid-mk circle.o { fill: var(--gold); stroke: var(--ink); stroke-width: 2.5; }
.mid-mk circle.c { fill: var(--ink); }
.mid-mk .let { fill: var(--ink) !important; }
.pulse { fill: none; stroke: var(--gold); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(0.7); opacity: 0.95; } to { transform: scale(2.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0.6; } }
line.ab { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
line.err { stroke: var(--red); stroke-width: 2.4; vector-effect: non-scaling-stroke; }

/* Side panel */
.panelwrap { grid-area: panel; display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.hint { margin: 0; color: var(--muted); }
.btn { width: 100%; padding: 13px 18px; border: 0; border-radius: 8px; background: var(--btn); color: var(--btnfg); font: 600 17px/1.1 'Barlow', sans-serif; cursor: pointer; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn:not([disabled]):hover { filter: brightness(1.08); }
.tog { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; padding-inline: 2px; }
.tog input { width: 18px; height: 18px; accent-color: var(--btn); }

.rating { font: 700 15px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
.pts { font: 700 68px/1 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.pts small { font-size: 20px; color: var(--muted); font-weight: 600; margin-left: 6px; }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--blue); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
dl { margin: 0; display: grid; gap: 8px; }
dl div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.recap { list-style: none; margin: 0; padding: 0; display: grid; }
.recap li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; border-top: 1px solid var(--line); padding: 8px 0; font-variant-numeric: tabular-nums; }
.recap .n { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--ink); display: grid; place-items: center; font: 700 13px/1 'Barlow Condensed', sans-serif; }
.recap .km { color: var(--muted); }
.recap .p { font-weight: 600; min-width: 3ch; text-align: right; }

  </div>
</div>

  function pickPairs(n) {
    var used = new Set(), pairs = [], guard = 0, RG = COUNTRIES[country].range;
    while (pairs.length < n && guard++ < 20000) {
      var a = CITIES[Math.floor(Math.random() * CITIES.length)], b = CITIES[Math.floor(Math.random() * CITIES.length)];
      if (a === b || used.has(a) || used.has(b)) continue;
      var d = hav(a.ll, b.ll);
      if (d < RG[0] || d > RG[1]) continue;
      used.add(a); used.add(b);
      pairs.push({ a: a, b: b, d: d, mid: midpoint(a.ll, b.ll) });
    }
    return pairs;
  }
  function startGame() {
    state = { round: 0, total: 0, pairs: pickPairs(ROUNDS), results: [], phase: 'guess', guess: null };
    $('#sign').hidden = false;
    setupRound();
  }
  function setupRound() {
    var s = state, p = s.pairs[s.round];
    s.phase = 'guess'; s.guess = null;
    renderSign();
    tweenTo(FULL);
    drawOverlay(); renderPanel(); renderStats();
  }
  function placeGuess(cx, cy) {
    if (!state || state.phase !== 'guess') return;
    var q = toSvg(cx, cy);
    state.guess = inv(q[0], q[1]);
    drawOverlay(); renderPanel();
  }
  function lock() {
    var s = state;
    if (s.phase !== 'guess' || !s.guess) return;
    var p = s.pairs[s.round];
    var km = hav(s.guess, p.mid), pts = Math.round(1000 * Math.exp(-km / COUNTRIES[country].scale));
    var near = null, nk = Infinity;
    CITIES.forEach(function (c) { var d = hav(c.ll, p.mid); if (d < nk) { nk = d; near = c; } });
    s.results.push({ a: p.a, b: p.b, d: p.d, mid: p.mid, guess: s.guess, km: km, pts: pts, near: near, nk: nk });
    s.total += pts; s.phase = 'result';
    drawOverlay();
    fitPoints([p.a.ll, p.b.ll, s.guess, p.mid]);
    renderPanel(); renderStats();
  }
  function next() {
    var s = state;
    if (s.round < s.pairs.length - 1) { s.round++; setupRound(); return; }
    s.phase = 'final';
    if (best === null || s.total > best) {
      best = s.total;
      try { localStorage.setItem('mi-chemin-best-' + country, String(best)); } catch (e) {}
    }
    $('#sign').hidden = true;
    tweenTo(FULL);
    drawOverlay(); renderPanel(); renderStats();
  }

  function drawOverlay() {
    var s = state;
    over.replaceChildren();
    if (s.phase === 'final') {
      s.results.forEach(function (r) { line(r.guess, r.mid, 'err'); });
      s.results.forEach(function (r, i) { guessMarker(r.guess, true); midMarker(r.mid, String(i + 1), true); });
    } else {
      var p = s.pairs[s.round];
      if (s.phase === 'result') { line(p.a.ll, p.b.ll, 'ab'); line(s.guess, p.mid, 'err'); }
      if (s.phase === 'result') { cityMarker(p.a, 'A'); cityMarker(p.b, 'B'); }
      if (s.phase === 'result') midMarker(p.mid, t('midpoint'));
      if (s.guess) guessMarker(s.guess, false, s.phase === 'result' ? t('you') : '');
    }
    updateScale();
  }

  function word(km) {
    var w = t('w'), f = COUNTRIES[country].scale / 150;
    return km < 10 * f ? w[0] : km < 30 * f ? w[1] : km < 75 * f ? w[2] : km < 150 * f ? w[3] : km < 300 * f ? w[4] : w[5];
  }
  function title(total) {
    var avg = total / ROUNDS, ti = t('ti');
    return avg >= 800 ? ti[0] : avg >= 600 ? ti[1] : avg >= 400 ? ti[2] : avg >= 200 ? ti[3] : ti[4];
  }
  function renderSign() {
    var p = state.pairs[state.round];
    $('#ca').textContent = p.a.name; $('#cb').textContent = p.b.name;
    $('#dist').textContent = t('halfway').replace('{n}', fmt(p.d));
  }
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.dataset.i18n); });
    $('#z-in').setAttribute('aria-label', t('zin')); $('#z-in').title = t('zin');
    $('#z-out').setAttribute('aria-label', t('zout')); $('#z-out').title = t('zout');
    $('#z-fit').textContent = t('fit');
    $('#z-fit').setAttribute('aria-label', t('fitT')); $('#z-fit').title = t('fitT');
    svg.setAttribute('aria-label', t(COUNTRIES[country].aria));
    $('.tag').textContent = t(COUNTRIES[country].tag);
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.country === country ? 'true' : 'false'); });
    var geoT = t('geo');
    geoEls.forEach(function (g) { g[1].textContent = geoT[g[0]]; });
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
  }
  function setLang(l) {
    if (LANGS.indexOf(l) < 0) return;
    lang = l;
    try { localStorage.setItem('mi-chemin-lang', l); } catch (e) {}
    applyStatic();
    if (state) {
      if (state.phase !== 'final') renderSign();
      renderPanel(); renderStats(); drawOverlay();
    }
  }

  function loadBest() {
    best = null;
    try {
      var v = localStorage.getItem('mi-chemin-best-' + country);
      if (v === null && country === 'fr') v = localStorage.getItem('mi-chemin-best');
      var n = parseInt(v, 10);
      if (!isNaN(n)) best = n;
    } catch (e) {}
  }
  function setCountry(c) {
    if (!COUNTRIES[c] || (state && c === country)) return;
    country = c;
    try { localStorage.setItem('mi-chemin-country', c); } catch (e) {}
    CITIES = COUNTRIES[c].cities;
    configureProj(COUNTRIES[c].proj);
    buildMap();
    loadBest();
    applyStatic();
    startGame();
  }

  function renderStats() {
    var s = state;
    $('#st-round').textContent = Math.min(s.round + 1, ROUNDS) + '/' + ROUNDS;
    $('#st-score').textContent = fmt(s.total);
    $('#st-best').textContent = best === null ? '–' : fmt(best);
  }

  function renderPanel() {
    var s = state, p = $('#panel');
    if (s.phase === 'guess') {
      p.innerHTML =
        '<p class="hint">' + (s.guess
          ? t('hintPlaced')
          : t('hintNone')) + '</p>' +
        '<button class="btn" data-act="lock"' + (s.guess ? '' : ' disabled') + '>' + t('lock') + '</button>';
    } else if (s.phase === 'result') {
      var r = s.results[s.results.length - 1], last = s.round === s.pairs.length - 1;
      p.innerHTML =
        '<div class="rating">' + word(r.km) + '</div>' +
        '<div class="pts">+' + r.pts + '<small>/ 1000</small></div>' +
        '<div class="meter"><i style="width:' + (r.pts / 10) + '%"></i></div>' +
        '<p class="legend"><span><i class="dot" style="background:var(--red)"></i>' + t('lgGuess') + '</span><span><i class="dot" style="background:var(--gold)"></i>' + t('lgMid') + '</span></p>' +
        '<dl><div><dt>' + t('yourDist') + '</dt><dd>' + fmtKm(r.km) + '</dd></div>' +
        '<div><dt>' + t('nearest') + '</dt><dd>' + r.near.name + ' · ' + fmtKm(r.nk) + '</dd></div>' +
        '<div><dt>' + t('route').replace('{a}', r.a.name).replace('{b}', r.b.name) + '</dt><dd>' + fmtKm(r.d) + '</dd></div></dl>' +
        '<button class="btn" data-act="next">' + (last ? t('final') : t('next')) + '</button>';
    } else {
      var rows = s.results.map(function (r, i) {
        return '<li><span class="n">' + (i + 1) + '</span><span>' + r.a.name + ' – ' + r.b.name + '</span><span class="km">' + fmtKm(r.km) + '</span><span class="p">' + r.pts + '</span></li>';
      }).join('');
      p.innerHTML =
        '<div class="rating">' + title(s.total) + '</div>' +
        '<div class="pts">' + fmt(s.total) + '<small>/ ' + fmt(ROUNDS * 1000) + '</small></div>' +
        '<div class="meter"><i style="width:' + (s.total / (ROUNDS * 10)) + '%"></i></div>' +
        '<ol class="recap">' + rows + '</ol>' +
        '<button class="btn" data-act="again">' + t('again') + '</button>';
    }
  }

  $('#panel').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var a = b.dataset.act;
    if (a === 'lock') lock(); else if (a === 'next') next(); else if (a === 'again') startGame();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = document.activeElement && document.activeElement.tagName;
    if (t === 'BUTTON' || t === 'INPUT') return;
    var b = document.querySelector('#panel .btn:not([disabled])');
    if (b) b.click();
  });

  document.querySelectorAll('.langs button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { setCountry(b.dataset.country); }); });
  setCountry(country);
  window.__miChemin = { hav: hav, midpoint: midpoint, pickPairs: pickPairs, COUNTRIES: COUNTRIES, setCountry: setCountry, getCities: function () { return CITIES; } };
})();
</script>

</body></html>
